appId: com.pynos.squish
productName: "Pyno's Squish"
copyright: "Pyno's"
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter: [ffmpeg.exe, ffprobe.exe, LICENSE.txt]
asar: true
win:
  target: nsis
  icon: build/icon.png
  artifactName: "Pynos-Squish-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: "Pyno's Squish"
  uninstallDisplayName: "Pyno's Squish"
# Auto-update feed: a Cloudflare R2 bucket served at updates.pynos-ae-suite.de.
# Upload the .exe, .blockmap and latest.yml from release/ into its squish/ folder.
# Customers' apps read latest.yml from there.
publish:
  provider: generic
  url: https://updates.pynos-ae-suite.de/squish
