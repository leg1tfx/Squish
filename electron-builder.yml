appId: com.pynos.squish
productName: "Pyno's Squish"
copyright: "Pyno's"
directories:
  output: release
  buildResources: build
files:
  - out/**/*
  - package.json
extraResources:
  - from: resources/bin
    to: bin
    filter: [ffmpeg.exe, ffprobe.exe, LICENSE.txt]
asar: true
win:
  target: nsis
  icon: build/icon.png
  artifactName: "Pynos-Squish-Setup-${version}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  shortcutName: "Pyno's Squish"
  uninstallDisplayName: "Pyno's Squish"
# Auto-update feed. The source repo is private, so installers are published to a
# separate public repo that holds only releases (no code). Customers' apps read
# latest.yml from its newest release.
publish:
  provider: github
  owner: leg1tfx
  repo: squish-releases
  releaseType: release
